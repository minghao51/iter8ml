name: Benchmarks

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  openml-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --group dev --extra full
      - run: uv run python benchmarks/run_openml_benchmark.py --config benchmarks/configs/cpu_benchmark.yaml --quick --fail-on-errors
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
