name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --group dev --extra full
      - uses: pre-commit/action@v3.0.1

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --group dev --extra full
      - run: uv run mypy .

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev --extra full
      - run: uv run pytest tests/unit/ -v --tb=short
      - run: uv run pytest tests/integration/ -v --tb=short
      - run: uv run pytest tests/e2e/ -v --tb=short

  coverage:
    runs-on: ubuntu-24.04
    env:
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --group dev --extra full
      - run: >
          uv run pytest tests/unit/ tests/integration/ tests/e2e/
          --cov=src/iter8ml/engine
          --cov=src/iter8ml/services
          --cov=src/iter8ml/config.py
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=70
      - run: uv run python scripts/check_legacy_namespace.py

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev --extra full
      - run: uv run pip-audit -f json -o pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json

  validation-gate:
    # Mirrors the AGENTS.md local validation block end-to-end: the exact sync
    # flags (--all-extras keeps optuna/xgboost/lightgbm installed), the full
    # pytest suite in one run, plain ruff commands, mypy with the local
    # build/ exclude, the legacy-namespace check, and mkdocs build (docs.yml
    # only builds on main — this enforces docs on PRs too).
    runs-on: ubuntu-24.04
    env:
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --all-groups --all-extras
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy . --exclude 'build/'
      - run: make check-legacy-namespace
      - run: uv run mkdocs build
