name: docs
on:
  push:
    branches: [main]
    tags: ['v*']
# One Pages deployment at a time; deploy-pages needs these scopes.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: uv sync --frozen --group dev --extra train --extra docs
      - name: Render notebooks
        run: uv run quarto render notebooks/
      - name: Generate notebook stubs
        run: uv run python scripts/generate_notebook_docs.py
      - name: Build site
        run: uv run mkdocs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
