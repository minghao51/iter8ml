name: docs
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - uses: quarto-dev/quarto-action/setup@v2
      - run: uv sync --frozen --group dev --extra train --extra docs
      - name: Render notebooks
        run: uv run quarto render notebooks/
      - name: Generate notebook stubs
        run: uv run python scripts/generate_notebook_docs.py
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy
        run: uv run mike deploy --push --update-aliases ${{ github.ref_name }} latest
