# CPU-friendly benchmark suite for the portfolio (no GPU, 15 GB RAM).
# - Drops covertype (581k rows — RAM risk under 5-fold CV) and TabPFN (GPU/token).
# - Models: CatBoost / LightGBM / XGBoost on real OpenML + sklearn datasets.
# Deep / foundation models (FT-Transformer, TabNet, TabPFN) are supported by the
# framework but require a GPU; they are intentionally omitted in this CPU profile.

datasets:
  - source: openml
    id: 31
    name: credit-g
    task: classification
    description: "German credit (binary, 1k rows)"
  - source: openml
    id: 1590
    name: adult
    task: classification
    description: "Adult income (binary, 48k rows)"
  - source: openml
    id: 40685
    name: shuttle
    task: classification
    description: "Shuttle (multiclass, 58k rows)"
  - source: openml
    id: 61
    name: iris
    task: classification
    description: "Iris (multiclass, 150 rows)"
  - source: openml
    id: 44
    name: spambase
    task: classification
    description: "Spambase (binary, 4.6k rows)"
  - source: sklearn
    name: breast_cancer
    task: classification
    description: "Breast cancer (binary, 569 rows)"
  - source: openml
    id: 572
    name: house_16H
    task: regression
    description: "House prices (regression, 22k rows)"
  - source: openml
    id: 772
    name: quake
    task: regression
    description: "Earthquake (regression, 2k rows)"
  - source: sklearn
    name: diabetes
    task: regression
    description: "Diabetes (regression, 442 rows)"

models:
  classification:
    - catboost
    - lightgbm
    - xgboost
  regression:
    - catboost
    - lightgbm
    - xgboost

metrics:
  classification: ["roc_auc", "f1_macro"]
  regression: ["rmse", "r2"]

cv_folds: 5
random_seed: 42
