# Example: binary classification on a credit risk dataset
# Usage: uv run tabblueprint run --config examples/credit_risk.toml --data data/credit_risk_v2.parquet

name = "credit_risk_v2"
task = "classification"
target_col = "default"
data_path = "data/credit_risk_v2.parquet"

cv_folds = 5
cv_strategy = "stratified"

models = "auto"
metrics = ["roc_auc", "f1_macro", "log_loss"]

tracker = "jsonl"
run_quality_audit = true

run_hpo = false
hpo_n_trials = 100
