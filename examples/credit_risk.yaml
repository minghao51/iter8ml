# Example: binary classification on a credit risk dataset
# Usage: uv run iter8 run --config examples/credit_risk.yaml --data data/credit_risk_v2.parquet
# Pre-flight validate without training: append --check

name: credit_risk_v2
task: classification
target_col: default
data_path: data/credit_risk_v2.parquet

cv_folds: 5
cv_strategy: stratified

models: auto
metrics:
  - roc_auc
  - f1_macro
  - log_loss
# primary_metric: roc_auc   # ranking/promotion metric; defaults to metrics[0]
# ignore_cols: [customerID]  # drop IDs / leaky columns before feature engineering

tracker: jsonl
run_quality_audit: true

# Note: HPO is NOT config-driven. Run it separately with its own CLI options:
#   uv run iter8 hpo --data data/credit_risk_v2.parquet --target default --model catboost
# Search spaces live in engine/models/model_configs.py; folds/metrics/trials
# are controlled by iter8 hpo CLI options, not this file.
