site_name: Tabular Blueprint
site_url: https://minghao51.github.io/iter8ml/
repo_url: https://github.com/minghao51/iter8ml
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
extra_css:
  - stylesheets/notebooks.css
extra_javascript:
  - javascripts/notebooks.js
markdown_extensions:
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
nav:
  - Home: index.md
  - Architecture:
    - Pipeline Architecture: pipeline-architecture.md
    - Design Decisions: decisions/README.md
    - "ADR-0001 — One Hamilton DAG for training": decisions/0001-single-hamilton-dag.md
    - "ADR-0002 — Pipeline behavior is data": decisions/0002-pipeline-spec-config-when.md
    - "ADR-0003 — Medallion artifact contract": decisions/0003-medallion-artifact-contract.md
    - "ADR-0004 — Hardware-aware model routing": decisions/0004-hardware-aware-model-routing.md
    - "ADR-0005 — Two reliability seams": decisions/0005-two-reliability-seams.md
    - "ADR-0006 — CPU-first, GPU-ready": decisions/0006-cpu-first-gpu-ready.md
  - Medallion Runtime: medallion.md
  - Guides:
    - Data Loading: data-loading.md
    - Preprocessing: preprocessing.md
    - Feature Engineering: feature-engineering.md
    - Models: models.md
    - Evaluation: evaluation.md
    - HPO: hpo.md
    - Drift Detection: drift-detection.md
    - Explainability: explainability.md
  - Planning:
    - Deferred Research: plan/deferred-research.md
  - Notebooks:
    - Overview: notebooks/index.md
    - Live Demo — Telco Churn: notebooks/demo-telco-churn.md
    - Case Study — German Credit: notebooks/case-study-german-credit.md
    - Quick Start: notebooks/quick-start.md
    - Case Study — Agent Demo (Phase 3): notebooks/case-study-agent-demo.md
    - Archive: notebooks/archive/index.md
