site_name: Tabular Blueprint
site_url: https://minghao51.github.io/iter8ml/
repo_url: https://github.com/minghao51/iter8ml
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
extra_css:
  - stylesheets/notebooks.css
extra_javascript:
  - javascripts/notebooks.js
extra:
  version:
    provider: mike
markdown_extensions:
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.superfences
  - admonition
nav:
  - Home: index.md
  - Architecture: pipeline-architecture.md
  - Medallion Runtime: medallion.md
  - Guides:
    - Data Loading: data-loading.md
    - Preprocessing: preprocessing.md
    - Feature Engineering: feature-engineering.md
    - Models: models.md
    - Evaluation: evaluation.md
    - HPO: hpo.md
    - Drift Detection: drift-detection.md
    - Explainability: explainability.md
  - Notebooks:
    - Overview: notebooks/index.md
    - Quick Start: notebooks/quick-start.md
    - Model Comparison: notebooks/model-comparison.md
    - Drift Monitoring: notebooks/drift-monitoring.md
    - Feature Engineering & Explainability: notebooks/feature-engineering-explainability.md
    - Methodology Benchmarks: notebooks/methodology-benchmarks.md
