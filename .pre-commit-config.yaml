repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/notebooks/html/|notebooks/_freeze/)
      - id: end-of-file-fixer
        exclude: ^(docs/notebooks/html/|notebooks/_freeze/)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: ^docs/notebooks/html/|^notebooks/_freeze/
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^(notebooks/|benchmarks/archive/)
      - id: ruff-format
        exclude: ^(notebooks/|benchmarks/archive/)

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --skip-editable
        language: system
        always_run: true
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        always_run: true
        pass_filenames: false
      - id: quarto-render
        name: Render changed .qmd notebooks
        entry: make notebooks-staged
        language: system
        files: '^notebooks/.*\.qmd$'
        pass_filenames: false
