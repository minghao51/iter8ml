[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iter8ml"
version = "0.1.0"
description = "A high-velocity iteration framework for tabular ML"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "filelock>=3.12",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
base = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "optuna>=3.6",
    "sf-hamilton>=1.70",
]
deep = [
    "torch>=2.3",
    "accelerate>=0.30",
    "transformers>=4.40",
    "tabpfn>=2.0",
    "pytorch-tabular>=1.0",
]
tracking = [
    "wandb>=0.17",
    "mlflow>=2.13",
]
agent = [
    "mcp>=0.9",
    "litellm>=1.40",
]
audit = [
    "shap>=0.44",
    "cleanlab>=2.6",
]
docs = [
    "matplotlib>=3.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.0",
    "pymdown-extensions>=10.0",
]
full = [
    "iter8ml[base,deep,tracking,agent,audit,docs]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "marimo>=0.23.4",
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "jupyter-server>=2.18.0",
    "mako>=1.3.12",
    "urllib3>=2.7.0",
]

[project.scripts]
iter8 = "iter8ml.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
exclude = ["tests/", "benchmarks/", "notebooks/", "workspace/"]

[[tool.mypy.overrides]]
module = ["catboost.*", "lightgbm.*", "xgboost.*", "optuna.*", "polars.*", "sf_hamilton.*", "hamilton.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cleanlab.*", "shap.*", "wandb.*", "mlflow.*", "litellm.*",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pytorch_tabular.*", "tabpfn.*",
    "torch.*", "torch.utils.*", "transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*", "sklearn.*", "scipy.*", "psutil.*", "pandas.*", "yaml.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/iter8ml/cli/**/*.py" = ["B008"]
"src/iter8ml/cli.py" = ["F401"]
"notebooks/*" = ["E402", "I001", "B018", "E501", "RUF001", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts   = ["--strict-markers", "-ra", "--durations=10", "--import-mode=importlib"]
markers = [
    "slow: >1s tests",
    "integration: external services or slow tests",
    "unit: fast isolated tests",
    "e2e: full workflow tests",
    "serial: cannot run in parallel",
    "network: needs internet/auth",
    "smoke: critical path tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iter8ml = ["py.typed"]
