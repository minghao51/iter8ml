[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "iter8ml"
dynamic = ["version"]
description = "A high-velocity iteration framework for tabular ML"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["machine-learning", "tabular", "experiment", "automl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "filelock>=3.12",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "litellm[train]>=1.83.10",
    "mlflow[train]>=3.11.1",
    "cryptography[train]>=46.0.7",
    "gitpython[train]>=3.1.50",
    "python-multipart[train]>=0.0.27",
]

[project.optional-dependencies]
train = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "optuna>=3.6",
    "sf-hamilton>=1.70",
    "torch>=2.3",
    "accelerate>=0.30",
    "transformers>=4.40",
    "tabpfn>=2.0",
    "pytorch-tabular>=1.0",
    "wandb>=0.17",
    "mlflow>=2.13",
    "mcp>=0.9",
    "litellm>=1.40",
    "shap>=0.44",
    "cleanlab>=2.6",
]
docs = [
    "matplotlib>=3.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.0",
    "pymdown-extensions>=10.0",
]
full = [
    "iter8ml[train,docs]",
]

[project.urls]
Homepage = "https://github.com/anomalyco/iter8ml"
Repository = "https://github.com/anomalyco/iter8ml"
Documentation = "https://iter8ml.dev"

[project.entry-points."iter8ml.models"]
catboost = "iter8ml.engine.models.catboost_model:CatBoostModel"
lightgbm = "iter8ml.engine.models.lightgbm_model:LightGBMModel"
xgboost = "iter8ml.engine.models.xgboost_model:XGBoostModel"
tabpfn = "iter8ml.engine.models.tabpfn_model:TabPFNModel"
ft_transformer = "iter8ml.engine.models.ft_transformer:FTTransformerModel"
tabnet = "iter8ml.engine.models.tabnet_model:TabNetModel"
naive_baseline = "iter8ml.engine.models.baselines:NaiveBaseline"
linear_baseline = "iter8ml.engine.models.baselines:LinearBaseline"

[project.scripts]
iter8 = "iter8ml.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "marimo>=0.23.4",
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "jupyter-server>=2.18.0",
    "mako>=1.3.12",
    "urllib3>=2.7.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/iter8ml"]
artifacts = ["src/iter8ml/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
exclude = ["tests/", "benchmarks/", "notebooks/", "workspace/"]

[[tool.mypy.overrides]]
module = ["catboost.*", "lightgbm.*", "xgboost.*", "optuna.*", "polars.*", "sf_hamilton.*", "hamilton.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cleanlab.*", "shap.*", "wandb.*", "mlflow.*", "litellm.*",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pytorch_tabular.*", "tabpfn.*",
    "torch.*", "torch.utils.*", "transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*", "sklearn.*", "scipy.*", "psutil.*", "pandas.*", "yaml.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/iter8ml/cli/**/*.py" = ["B008"]
"src/iter8ml/cli.py" = ["F401"]
"notebooks/*" = ["E402", "I001", "B018", "E501", "RUF001", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts   = ["--strict-markers", "-ra", "--durations=10", "--import-mode=importlib"]
markers = [
    "slow: >1s tests",
    "integration: external services or slow tests",
    "unit: fast isolated tests",
    "e2e: full workflow tests",
    "serial: cannot run in parallel",
    "network: needs internet/auth",
    "smoke: critical path tests",
    "property: hypothesis property-based tests",
    "metamorphic: metamorphic relation tests",
    "contract: API contract / surface tests",
    "differential: reference implementation comparison",
]
