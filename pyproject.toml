[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-blueprint"
version = "0.1.0"
description = "A high-velocity iteration framework for tabular ML"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "optuna>=3.6",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "typer>=0.12",
    "psutil>=5.9",
    "rich>=13.0",
    "joblib>=1.3",
    "filelock>=3.12",
]

[project.optional-dependencies]
deep      = ["torch>=2.3", "accelerate>=0.30", "transformers>=4.40", "tabpfn>=2.0", "pytorch-tabular>=1.0", "datasets>=2.14"]
shap      = ["shap>=0.44"]
cleanlab  = [
    "cleanlab>=2.6",
]
llm       = ["mcp>=0.9", "litellm>=1.40"]
hamilton  = ["sf-hamilton>=1.70"]
wandb     = ["wandb>=0.17"]
mlflow    = ["mlflow>=2.13"]
all       = ["tabular-blueprint[deep,shap,cleanlab,llm,hamilton,wandb,mlflow]"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=3.6", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
tabblueprint = "tabular_blueprint.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
exclude = ["tests/", "benchmarks/"]

[[tool.mypy.overrides]]
module = ["catboost.*", "lightgbm.*", "xgboost.*", "optuna.*", "polars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cleanlab.*", "shap.*", "wandb.*", "mlflow.*", "litellm.*",
    "sf_hamilton.*", "hamilton.*", "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pytorch_tabular.*", "tabpfn.*", "accelerate.*", "datasets.*",
    "torch.*", "torch.utils.*", "transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tabular_blueprint.engine.hpo",
    "tabular_blueprint.engine.hpo_warmstart",
    "tabular_blueprint.engine.hpo_importance",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tabular_blueprint.pipelines.nodes.*",
    "tabular_blueprint.engine.trainer",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*", "sklearn.*", "scipy.*", "psutil.*", "pandas.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/tabular_blueprint/cli.py" = ["B008"]
"notebooks/*" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts   = ["--strict-markers", "-ra", "--durations=10", "--import-mode=importlib"]
markers = [
    "slow: >1s tests",
    "integration: external services or slow tests",
    "unit: fast isolated tests",
    "e2e: full workflow tests",
    "serial: cannot run in parallel",
    "network: needs internet/auth",
    "smoke: critical path tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabular_blueprint = ["py.typed"]
